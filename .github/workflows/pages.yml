# The website (dotatranslator.live) is served by GitHub Pages from the PUBLIC
# repository sc0rebreaker/dota-translator-releases, branch gh-pages - this
# source repository is private, and a free plan has no Pages for that.
#
# It runs on a RELEASE TAG (and by hand), never on an ordinary push: docs/
# here describes the version being worked on, which must not go live before
# the download does. Each run makes gh-pages exactly docs/ of the tagged
# commit and force-pushes it there with RELEASES_TOKEN (Contents read/write
# on the releases repository). docs/CNAME keeps the custom domain.
name: website

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Nothing by default: the job below is given exactly what it needs.
permissions: {}

jobs:
  publish:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Without this the checkout's own GITHUB_TOKEN stays in git's config
          # as an auth header for github.com and wins over RELEASES_TOKEN in
          # the URL below: the push to the other repository is refused
          # (0.7.0's run failed so).
          persist-credentials: false
      - name: docs/ becomes gh-pages of the releases repository
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::error::RELEASES_TOKEN is not set"; exit 1; fi
          test -f docs/CNAME
          git subtree split --prefix docs -b site
          git push -f "https://x-access-token:${TOKEN}@github.com/sc0rebreaker/dota-translator-releases.git" site:gh-pages
